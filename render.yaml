databases:
  - name: papelyluna-db
    plan: free

services:
  - type: web
    name: papelyluna-backend
    runtime: node
    plan: free
    buildCommand: "npm install && npm run migrate"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papelyluna-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true